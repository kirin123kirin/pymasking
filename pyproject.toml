[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymasking"
dynamic = ["version"]
description = "個人情報マスキングツール（Web UI + CLI）"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["masking", "privacy", "japanese", "personal-information", "NLP"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Topic :: Security",
]
dependencies = [
    "flask>=2.0",
    "click>=8.0",
    "Pillow>=9.0",
    "PyMuPDF>=1.20",
    "python-docx>=0.8",
    "openpyxl>=3.0",
    "python-pptx>=0.6",
    "chardet>=4.0",
    "python-dateutil>=2.8",
    "ja-ginza>=5.0",
    "spacy>=3.0",
    "easyocr>=1.7",
]

[tool.setuptools_scm]
# git tag (例: v1.2.0) からバージョンを自動生成

[tool.setuptools.packages.find]
where = ["."]
include = ["pymasking*"]

[tool.setuptools.package-data]
"pymasking" = [
    "web/templates/*.html",
    "web/static/*",
    "data/dict/*.txt",
    "bat/*.bat",
]
